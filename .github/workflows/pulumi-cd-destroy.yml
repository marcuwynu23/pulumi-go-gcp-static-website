name: CD - Pulumi GCP Static Website (Destroy)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: GCP region
        required: true
        type: string
        default: us-central1
      bucket_name:
        description: Base bucket name (random suffix appended)
        required: true
        type: string
      main_page_suffix:
        description: Index page
        required: true
        type: string
        default: index.html
      not_found_page:
        description: 404 page
        required: true
        type: string
        default: 404.html
      enable_public_access:
        description: Grant public read access
        required: true
        type: string
        default: "true"
      website_content_path:
        description: Path to static website files
        required: true
        type: string
        default: website
      backend_type:
        description: State backend (local, gcs, pulumi)
        required: true
        type: string
        default: local
      gcs_state_bucket:
        description: GCS bucket for state (if backend_type=gcs)
        required: false
        type: string
        default: ""

env:
  PULUMI_STACK: static-website-${{ github.event.inputs.region }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  GCP_PROJECT: ${{ github.event.inputs.project_id }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

jobs:
  destroy:
    name: Pulumi Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          command: version

      - name: Configure Pulumi Backend
        run: |
          if [ "${{ github.event.inputs.backend_type }}" = "local" ]; then
            pulumi login --local
            echo "Using local filesystem backend"
          elif [ "${{ github.event.inputs.backend_type }}" = "gcs" ]; then
            if [ -z "${{ github.event.inputs.gcs_state_bucket }}" ]; then
              echo "ERROR: gcs_state_bucket required for gcs backend"
              exit 1
            fi
            pulumi login gs://${{ github.event.inputs.gcs_state_bucket }}
            echo "Using GCS backend: gs://${{ github.event.inputs.gcs_state_bucket }}"
          else
            if [ -z "${{ secrets.PULUMI_ACCESS_TOKEN }}" ]; then
              echo "ERROR: PULUMI_ACCESS_TOKEN required for Pulumi Cloud backend"
              exit 1
            fi
            pulumi login --cloud-url https://api.pulumi.com
            echo "Using Pulumi Cloud backend"
          fi

      - name: Configure Pulumi Stack
        run: |
          pulumi stack select ${{ env.PULUMI_STACK }} 2>/dev/null || echo "Stack not found"

      - name: Set Pulumi Config
        run: |
          pulumi config set gcp:project ${{ github.event.inputs.project_id }}
          pulumi config set gcp:region ${{ github.event.inputs.region }}
          pulumi config set website:bucketName ${{ github.event.inputs.bucket_name }}
          pulumi config set website:mainPageSuffix ${{ github.event.inputs.main_page_suffix }}
          pulumi config set website:notFoundPage ${{ github.event.inputs.not_found_page }}
          pulumi config set website:enablePublicAccess ${{ github.event.inputs.enable_public_access }}
          pulumi config set website:websiteContentPath ${{ github.event.inputs.website_content_path }}

      - name: Download Go Dependencies
        run: go mod download

      - name: Go Build
        run: go build -v .

      - name: Pulumi Preview (Destroy)
        run: |
          pulumi preview --stack ${{ env.PULUMI_STACK }} --destroy --yes

      - name: Pulumi Destroy
        run: |
          pulumi destroy --stack ${{ env.PULUMI_STACK }} --yes