name: pulumi-go-gcp-static-website
description: Pulumi GCP Static Website hosting on Cloud Storage
runtime: go
config:
  gcp:region:
    description: The region in which to provision resources
    value: us-central1
  website:mainPageSuffix:
    description: The page served when a directory is requested (index page).
    value: index.html
  website:notFoundPage:
    description: The page served when a resource is not found (404 page).
    value: 404.html
  website:enablePublicAccess:
    description: Whether to grant public read access to allUsers
    value: 'true'
  website:websiteContentPath:
    description: Path to the directory containing the static website files
    value: website
